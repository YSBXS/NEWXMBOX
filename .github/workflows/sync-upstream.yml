name: Sync XMBOX Upstream to main
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        # 这里不要写token字段！直接使用系统自带GITHUB_TOKEN
      - name: Sync follow upstream
        run: |
          git remote add upstream https://github.com/Tosencen/XMBOX.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
