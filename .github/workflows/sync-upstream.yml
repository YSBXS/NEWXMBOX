name: Sync XMBOX Upstream to main
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}
      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/Tosencen/XMBOX.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
